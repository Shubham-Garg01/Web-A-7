<!DOCTYPE html>
<html lang="en">
<head>
    <title>FORM</title>
</head>
<body>
    <form method="get" autocomplete="on">
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><hr>
        <label>E-mail:</label>
        <input type="email" placeholder="Email">
        <br><hr>
        <label>DOB:</label>
        <input type="date">
        <br><hr>
        <label>Password</label>
        <input type="password" placeholder="Password" pattern="A-Za-z0-9" title="Your password must contain alpha numerals">
        <br><hr>
        <label>Country</label>
        <select>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Europe"></option>
            <option value="China"></option>
            <option value="Pakistan"></option>
        </select>
        <br><hr>
        <button type="submit">
        Submit
    </button>
    </form>
</body>
</html>
