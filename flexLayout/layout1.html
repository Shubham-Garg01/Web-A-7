<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: antiquewhite;
            text-align: center;
        }
        main{
            width: 960px;
            height: auto;
            background-color: rgb(249, 244, 237);
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header{
            width: 960px;
            height: 100px;
            background-color: #ccc;
        }
        nav{
            width: 960px;
            height: 80px;
            background-color: #ccc;
        }
        section{
            width: 960px;
            height: 400px;
            display: flex;
            flex-direction: row;
            column-gap: 10px;
        }
        #left{
            flex-grow: 1;
            background-color: #ccc;
        }
        #right{
            flex-grow: 2;
            background-color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        aside,article{
            flex-grow: 1;
            background-color: #ccc;
        }
        footer{
            width: 960px;
            height: 300px;
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <!--main start-->
    <main>
        <!-- header -->
        <header>
            <h2>Header</h2>
        </header>
        <nav>
            <h2>Navbar</h2>
        </nav>
        <!-- section -->
        <section>
            <div id = "left">
            </div>
            <div id = "right">
                <aside>
                    <h2>Aside</h2>
                </aside>
                <article>
                    <h2>Article</h2>
                </article>
            </div>
        </section>
        <!-- footer -->
        <footer>
            <h2>Footer</h2>
        </footer>
    </main>
</body>
</html>
