<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
</head>
<body>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><hr><br>
        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br><hr><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter your password">
        <br><hr><br>
        <label>DOB:</label>
        <input type="date" placeholder="Enter your age">
        <br><hr><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><hr><br>
        <label>Subjects:</label>
        <input type="checkbox" name="subject" value="maths"> CSS
        <input type="checkbox" name="subject" value="science"> HTML
        <input type="checkbox" name="subject" value="history"> JS
        <br><hr><br>
        <label>File:</label>
        <input type="file">
        <br><hr><br>
        <button>Submit</button>
        <button>Reset</button>
    </form>
</body>
</html>
