<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form>
        <label>Username or E-mail:</label>
        <input type="text" placeholder="Enter your username or email">
        <br><hr><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter your password" title="Password must be 8-20 characters long and include both letters and numbers" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" required>
        <br><hr><br>
        <button>Submit</button>
    </form>
</body>
</html>
